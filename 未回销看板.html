<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>业务数据清洗与未回销看板</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.35.3/plotly.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root {
  --sidebar-w: 320px;
  --primary: #5470c6;
  --bg: #f5f6fa;
  --card-bg: #fff;
  --text: #2c3e50;
  --border: #e2e8f0;
  --log-bg: #1e1e2e;
  --log-text: #cdd6f4;
  --success: #27ae60;
  --warn: #f39c12;
  --danger: #e74c3c;
  --radius: 8px;
  --shadow: 0 1px 3px rgba(0,0,0,.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans SC", sans-serif; background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }

/* ---- SIDEBAR ---- */
#sidebar {
  width: var(--sidebar-w); min-width: var(--sidebar-w); background: #fff;
  border-right: 1px solid var(--border); padding: 18px 16px;
  display: flex; flex-direction: column; gap: 12px;
  height: 100vh; overflow-y: auto; flex-shrink: 0;
  box-shadow: var(--shadow); z-index: 10;
  scrollbar-width: thin;
}
#sidebar h2 { font-size: 1.05rem; color: var(--primary); margin-bottom: 2px; }
#sidebar label { font-size: .82rem; font-weight: 600; color: #555; margin-bottom: -6px; display: block; }
#sidebar input[type="file"] { font-size: .8rem; }
#sidebar select, #sidebar .multi-select { width: 100%; padding: 6px 8px; border: 1px solid var(--border); border-radius: 5px; font-size: .82rem; background: #fff; }
#sidebar .multi-select { max-height: 230px; overflow-y: auto; border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; background: #fafbfd; }
#sidebar .multi-select label { display: flex; align-items: center; gap: 6px; font-weight: 400; margin: 3px 0; cursor: pointer; font-size: .8rem; }
#sidebar .multi-select label:hover { background: #eef1f8; border-radius: 4px; }
.people-filter { display: flex; flex-direction: column; gap: 6px; }
#peopleSearch { width: 100%; padding: 6px 8px; border: 1px solid var(--border); border-radius: 5px; font-size: .82rem; background: #fff; }
.multi-select-actions { display: flex; align-items: center; gap: 8px; }
.mini-btn { font-size: .72rem; padding: 4px 10px; border: 1px solid var(--border); border-radius: 5px; background: #fff; color: var(--primary); cursor: pointer; font-weight: 600; }
.mini-btn:hover { background: #eef1f8; }
.count-line { font-size: .72rem; color: #888; white-space: nowrap; }
#sidebar button { padding: 10px 14px; border: none; border-radius: 6px; cursor: pointer; font-size: .85rem; font-weight: 600; width: 100%; transition: opacity .2s; }
#sidebar button:hover { opacity: .85; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-secondary { background: #e8ecf4; color: var(--primary); }
.btn-outline { background: #fff; border: 1px solid var(--primary); color: var(--primary); }
#sidebar hr { border: none; border-top: 1px solid var(--border); margin: 4px 0; }

details { font-size: .8rem; }
details summary { cursor: pointer; font-weight: 600; color: #555; padding: 4px 0; }
#log-panel { background: var(--log-bg); color: var(--log-text); padding: 10px; border-radius: 5px; max-height: 160px; overflow-y: auto; font-family: "SF Mono", "Fira Code", monospace; font-size: .73rem; white-space: pre-wrap; word-break: break-all; }

.alert { padding: 8px 10px; border-radius: 5px; font-size: .78rem; margin: -6px 0; }
.alert-success { background: #d5f5e3; color: #1e8449; }
.alert-warn { background: #fef9e7; color: #b7950b; }
.alert-info { background: #d6eaf8; color: #21618c; }

/* ---- MAIN ---- */
#main { flex: 1; padding: 28px 32px; overflow-y: auto; max-height: 100vh; }
#main h1 { font-size: 1.5rem; margin-bottom: 20px; color: var(--primary); }

.metrics-row { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 6px; }
.metric-card {
  background: var(--card-bg); border-radius: var(--radius); padding: 20px 28px;
  box-shadow: var(--shadow); min-width: 180px; flex: 1; max-width: 260px;
}
.metric-card .label { font-size: .82rem; color: #888; margin-bottom: 6px; }
.metric-card .value { font-size: 2rem; font-weight: 700; color: var(--primary); }

#chart-container { background: var(--card-bg); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); margin: 14px 0; }
#chart { width: 100%; min-height: 420px; }

#table-container { background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow); padding: 8px; margin-top: 6px; }
#table-container table { width: 100%; border-collapse: collapse; font-size: .82rem; }
#table-container th { background: #f8f9fc; padding: 10px 8px; text-align: left; font-weight: 600; border-bottom: 2px solid var(--border); cursor: pointer; user-select: none; position: sticky; top: 0; }
#table-container th:hover { background: #eef1f8; }
#table-container td { padding: 8px; border-bottom: 1px solid #f0f0f0; }
#table-container tr:hover td { background: #f8faff; }
#table-wrapper { max-height: 500px; overflow: auto; }

.placeholder { text-align: center; color: #aaa; padding: 60px 20px; }
.placeholder .icon { font-size: 3rem; margin-bottom: 12px; }

.section-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 10px; color: #444; }
.divider { border: none; border-top: 1px solid var(--border); margin: 20px 0; }

/* ---- RESPONSIVE ---- */
@media (max-width: 768px) {
  body { flex-direction: column; height: auto; overflow: visible; }
  #sidebar { width: 100%; min-width: unset; height: auto; max-height: unset; position: static; border-right: none; border-bottom: 1px solid var(--border); }
  #main { max-height: unset; padding: 16px; }
}
</style>
</head>
<body>

<!-- ==================== SIDEBAR ==================== -->
<div id="sidebar">
  <h2>📊 控制面板</h2>

  <label>📤 上传业务数据 Excel</label>
  <input type="file" id="rawFile" accept=".xlsx,.xls" style="font-size:.8rem;">

  <label>📤 上传主号映射模板 Excel <span style="font-weight:400;color:#999;">(可选)</span></label>
  <input type="file" id="mappingFile" accept=".xlsx,.xls" style="font-size:.8rem;">

  <hr>
  <details>
    <summary>📋 运行状态与日志</summary>
    <div id="log-panel">等待数据上传...</div>
  </details>
  <hr>

  <label>🏢 所属机构</label>
  <select id="institutionSelect"><option value="">全部机构</option></select>

  <label>🔍 业务员筛选</label>
  <div class="people-filter">
    <input type="text" id="peopleSearch" placeholder="搜索业务员姓名…" autocomplete="off">
    <div class="multi-select-actions">
      <button type="button" class="mini-btn" onclick="selectAllPeople()">全选</button>
      <button type="button" class="mini-btn" onclick="clearAllPeople()">清空</button>
      <span class="count-line" id="peopleCount"></span>
    </div>
    <div class="multi-select" id="peopleMultiSelect"></div>
  </div>

  <hr>
  <button class="btn-primary" onclick="runPipeline()">🚀 执行清洗</button>

  <div id="baseDateAlert" style="display:none;"></div>
  <div id="baseDateManual" style="display:none;">
    <label>⚠️ 手动选择基准日期列：</label>
    <select id="baseDateColSelect"></select>
    <button class="btn-outline" onclick="runPipeline()" style="margin-top:6px;">🔄 重新执行清洗</button>
  </div>

  <hr>
  <div id="exportSection" style="display:none;">
    <label>📥 导出清单</label>
    <button id="btnExportSelected" class="btn-secondary" onclick="exportSelected()" style="margin-bottom:6px;"></button>
    <button id="btnExportInstitution" class="btn-outline" onclick="exportInstitution()" style="display:none;"></button>
  </div>

  <div style="font-size:.7rem;color:#bbb;text-align:center;margin-top:8px;padding-top:12px;border-top:1px solid var(--border);">
    v2.0 · 纯浏览器运行 · 无需 Python
  </div>
</div>

<!-- ==================== MAIN ==================== -->
<div id="main">
  <h1>业务数据清洗与未回销看板</h1>

  <div id="mainPlaceholder" class="placeholder">
    <div class="icon">👈</div>
    <p>请从左侧上传数据并点击「执行清洗」</p>
  </div>

  <div id="dashboardContent" style="display:none;">
    <div class="section-title">📊 汇总指标</div>
    <div class="metrics-row" id="metricsRow"></div>
    <hr class="divider">
    <div class="section-title">📈 未回销分布</div>
    <div id="chart-container"><div id="chart"></div></div>
    <hr class="divider">
    <div class="section-title">📋 未回销明细 <span id="rowCount" style="font-weight:400;font-size:.82rem;color:#888;"></span></div>
    <div id="table-container">
      <div id="table-wrapper"><table><thead id="tableHead"></thead><tbody id="tableBody"></tbody></table></div>
    </div>
  </div>
</div>

<!-- ==================== SCRIPT ==================== -->
<script>
// ============================================================
// CONFIG (from config.yaml)
// ============================================================
const CONFIG = {
  column_mapping: {
    "业务员": ["业务员","销售人员","sales","salesman","业务员姓名"],
    "出单日期": ["出单日期","订单日期","order_date","开单日期","交易日期"],
    "金额": ["金额","amount","总金额","交易金额"],
    "单号": ["单号","订单号","编号","id","order_id"]
  },
  due_days: {
    reference_date: "today",
    base_date_aliases: ["出单日期","签单日期","保单日期","OrderDate","IssueDate"],
    buckets: [
      { label:"0-15天", min:0, max:15 },
      { label:"15-30天", min:16, max:30 },
      { label:"30-60天", min:31, max:60 },
      { label:"60-90天", min:61, max:90 },
      { label:"超90天", min:91, max:9999 }
    ]
  },
  export: {
    filename_format: "{timestamp}_{description}_{salesperson}.xlsx",
    timestamp_format: "YYYYMMDD_HHmmss",
    description: "未回销清单",
    sheet_name: "未回销明细"
  },
  dashboard: {
    chart: {
      title: "未回销件数分布（按到期天数）",
      x_label: "到期天数区间",
      y_label: "未回销件数",
      color_sequence: ["#5470c6","#91cc75","#fac858","#ee6666","#fc8452"]
    }
  }
};

// ============================================================
// GLOBAL STATE
// ============================================================
let rawWorkbook = null;       // raw file workbook
let mappingWorkbook = null;   // mapping file workbook
let rawData = null;           // array of objects (cleaned)
let originalColumns = [];     // original column names from raw file
let auditLog = [];
let baseDateMatch = { status: "pending", matched_column: "" };
let baseDateManualCol = null; // user-selected base date column

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ============================================================
// LOGGING
// ============================================================
function log(level, msg) {
  const ts = new Date().toLocaleTimeString();
  auditLog.push(`[${ts}] ${level.toUpperCase().padEnd(5)} | ${msg}`);
  renderLog();
}
function renderLog() {
  document.getElementById("log-panel").textContent = auditLog.slice(-50).join("\n") || "等待操作...";
  const panel = document.getElementById("log-panel");
  panel.scrollTop = panel.scrollHeight;
}

// ============================================================
// FILE READING (SheetJS)
// ============================================================
function readExcel(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const wb = XLSX.read(e.target.result, { type: "array" });
        resolve(wb);
      } catch (err) {
        reject(err);
      }
    };
    reader.onerror = reject;
    reader.readAsArrayBuffer(file);
  });
}

function workbookToObjects(wb, sheetIndex = 0) {
  const name = wb.SheetNames[sheetIndex];
  const sheet = wb.Sheets[name];
  return XLSX.utils.sheet_to_json(sheet, { defval: "" });
}

function getWorkbookColumns(wb, sheetIndex = 0) {
  const name = wb.SheetNames[sheetIndex];
  const sheet = wb.Sheets[name];
  const data = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });
  return data.length > 0 ? data[0].map(c => String(c)) : [];
}

// ============================================================
// PIPELINE STEP 1: Normalize Columns
// ============================================================
function buildAliasMap() {
  const aliasMap = {};
  for (const [standard, aliases] of Object.entries(CONFIG.column_mapping)) {
    for (const alias of aliases) {
      aliasMap[alias.trim().toLowerCase()] = standard;
    }
  }
  return aliasMap;
}

function normalizeColumns(rows) {
  const aliasMap = buildAliasMap();
  const normalized = [];
  for (const row of rows) {
    const newRow = {};
    for (const [col, val] of Object.entries(row)) {
      const key = String(col).trim().toLowerCase();
      const mapped = aliasMap[key] || col;
      newRow[mapped] = val;
    }
    normalized.push(newRow);
  }
  log("info", `列名标准化完成，共 ${Object.keys(normalized[0]||{}).length} 列`);
  return normalized;
}

// ============================================================
// PIPELINE STEP 2: Clean Invalid
// ============================================================
function cleanInvalid(rows) {
  let cleaned = [];

  for (const row of rows) {
    // Amount coercion
    if ("金额" in row) {
      const num = Number(row["金额"]);
      if (isNaN(num) || row["金额"] === "" || row["金额"] === null) {
        continue; // remove null amounts (remove_nulls: true)
      }
      row["金额"] = num;
    }

    // Date coercion
    if ("出单日期" in row) {
      const d = parseDate(row["出单日期"]);
      row["出单日期"] = d ? d.toISOString().split("T")[0] : "";
    }

    cleaned.push(row);
  }

  log("info", `空值/异常值处理完成，保留 ${cleaned.length} 行`);
  return cleaned;
}

// ============================================================
// PIPELINE STEP 3: Apply Mapping
// ============================================================
function applyMapping(rows) {
  if (!mappingWorkbook) {
    // No mapping: fill empty columns for consistency
    for (const row of rows) {
      if (!("主号机构" in row)) row["主号机构"] = "";
      if (!("主号业务员" in row)) row["主号业务员"] = row["业务员"] || "";
    }
    log("info", "无映射表，保持原始业务员名称");
    return rows;
  }

  const mapRows = workbookToObjects(mappingWorkbook, 0);
  const mapCols = getWorkbookColumns(mappingWorkbook, 0);

  if (mapCols.length < 3) {
    log("warn", "映射表列数不足（需至少3列），跳过映射");
    for (const row of rows) {
      if (!("主号机构" in row)) row["主号机构"] = "";
      if (!("主号业务员" in row)) row["主号业务员"] = row["业务员"] || "";
    }
    return rows;
  }

  const instCol = mapCols[0];
  const masterCol = mapCols[1];
  const rawCol = mapCols[2];

  // Build lookup: 原始名 → { inst, master }
  const lookup = new Map();
  for (const mr of mapRows) {
    const alias = String(mr[rawCol] || "").trim();
    const inst = String(mr[instCol] || "").trim();
    const master = String(mr[masterCol] || "").trim();
    if (alias && master) {
      lookup.set(alias, { inst, master });
    }
  }

  let matched = 0;
  const unmatchedSet = new Set();

  for (const row of rows) {
    const origName = String(row["业务员"] || "").trim();
    const entry = lookup.get(origName);
    if (entry) {
      row["业务员"] = entry.master;
      row["主号机构"] = entry.inst;
      row["主号业务员"] = entry.master;
      matched++;
    } else {
      row["主号机构"] = row["主号机构"] || "";
      row["主号业务员"] = origName;
      if (origName) unmatchedSet.add(origName);
    }
  }

  const unmatched = [...unmatchedSet];
  log("info", `映射完成: 总计 ${rows.length} 行, 匹配成功 ${matched}, 未匹配 ${rows.length - matched}`);
  if (unmatched.length > 0) {
    log("warn", `未匹配业务员: ${unmatched.slice(0,20).join(", ")}${unmatched.length>20?"...":""}`);
  }
  return rows;
}

// ============================================================
// PIPELINE STEP 4: Calculate Due Days
// ============================================================
function calcDueDays(rows) {
  const aliases = CONFIG.due_days.base_date_aliases;

  // Resolve base date column
  let resolvedCol = null;

  if (baseDateManualCol) {
    // Check if it exists in the first row
    if (rows.length > 0 && baseDateManualCol in rows[0]) {
      resolvedCol = baseDateManualCol;
      baseDateMatch = { status: "success", matched_column: baseDateManualCol };
    }
  }

  if (!resolvedCol) {
    // Auto-match: check aliases against columns
    const cols = rows.length > 0 ? Object.keys(rows[0]) : [];
    const colsLower = cols.map(c => String(c).trim().toLowerCase());

    for (const alias of aliases) {
      const key = alias.trim().toLowerCase();
      const idx = colsLower.indexOf(key);
      if (idx >= 0) {
        resolvedCol = cols[idx];
        baseDateMatch = { status: "success", matched_column: resolvedCol };
        break;
      }
    }
  }

  if (!resolvedCol) {
    baseDateMatch = { status: "failed", matched_column: "" };
    log("warn", "未自动识别到基准日期列，到期天数设为0");
    for (const row of rows) {
      row["基准日期"] = "";
      row["到期天数"] = 0;
    }
    return rows;
  }

  // Rename resolved column to 基准日期
  if (resolvedCol !== "基准日期") {
    for (const row of rows) {
      row["基准日期"] = row[resolvedCol];
    }
  }

  // Calculate due days
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const refMs = today.getTime();

  for (const row of rows) {
    const d = parseDate(row["基准日期"]);
    if (d) {
      row["基准日期"] = d.toISOString().split("T")[0];
      row["到期天数"] = Math.floor((refMs - d.getTime()) / (1000 * 60 * 60 * 24));
    } else {
      row["基准日期"] = String(row["基准日期"] || "");
      row["到期天数"] = 0;
    }
  }

  log("info", `到期天数计算完成，基准列: ${resolvedCol}`);
  return rows;
}

// ============================================================
// UTILITY: Date Parsing (handles serial numbers from Excel)
// ============================================================
function parseDate(val) {
  if (val instanceof Date) return isNaN(val.getTime()) ? null : val;
  if (typeof val === "number") {
    // Excel serial date (days since 1900-01-01 with the 1900 leap year bug)
    if (val > 1 && val < 200000) {
      const d = new Date((val - 25569) * 86400 * 1000);
      return isNaN(d.getTime()) ? null : d;
    }
    return null;
  }
  const s = String(val).trim();
  if (!s) return null;

  // Try ISO / yyyy-mm-dd
  const iso = new Date(s);
  if (!isNaN(iso.getTime())) return iso;

  // Try Chinese date formats: yyyy年mm月dd日, yyyy/mm/dd
  const m1 = s.match(/(\d{4})[年\/-](\d{1,2})[月\/-](\d{1,2})/);
  if (m1) {
    const d = new Date(+m1[1], +m1[2] - 1, +m1[3]);
    return isNaN(d.getTime()) ? null : d;
  }

  return null;
}

// ============================================================
// BUCKET GROUPING
// ============================================================
function getBucketLabel(days) {
  for (const b of CONFIG.due_days.buckets) {
    if (days >= b.min && days <= b.max) return b.label;
  }
  return CONFIG.due_days.buckets[CONFIG.due_days.buckets.length - 1].label;
}

// ============================================================
// PIPELINE ENTRY POINT
// ============================================================
async function runPipeline() {
  const rawFileEl = document.getElementById("rawFile");
  const mappingFileEl = document.getElementById("mappingFile");

  if (!rawFileEl.files.length) {
    alert("请先上传业务数据 Excel");
    return;
  }

  auditLog = [];
  log("info", "====== 开始执行清洗管道 ======");

  try {
    // Read files
    rawWorkbook = await readExcel(rawFileEl.files[0]);
    log("info", `读取业务数据：${rawFileEl.files[0].name}`);

    if (mappingFileEl.files.length) {
      mappingWorkbook = await readExcel(mappingFileEl.files[0]);
      log("info", `读取映射模板：${mappingFileEl.files[0].name}`);
    } else {
      mappingWorkbook = null;
    }

    // Get columns for manual date column selector
    originalColumns = getWorkbookColumns(rawWorkbook, 0);
    buildBaseDateManualSelector();

    // Convert to objects
    let rows = workbookToObjects(rawWorkbook, 0);
    log("info", `初始行数: ${rows.length}`);

    // Step 1: Normalize columns
    rows = normalizeColumns(rows);

    // Step 2: Clean invalid
    const beforeClean = rows.length;
    rows = cleanInvalid(rows);
    log("info", `步骤2完成: ${beforeClean} → ${rows.length} 行`);

    // Step 3: Apply mapping
    rows = applyMapping(rows);

    // Step 4: Calculate due days
    rows = calcDueDays(rows);

    rawData = rows;
    _lastPeopleList = null;
    const _ps = document.getElementById("peopleSearch");
    if (_ps) _ps.value = "";

    // Handle base date match result
    const alertEl = document.getElementById("baseDateAlert");
    const manualEl = document.getElementById("baseDateManual");

    if (baseDateMatch.status === "success") {
      alertEl.style.display = "block";
      alertEl.className = "alert alert-success";
      alertEl.textContent = `✓ 已自动识别基准日期列：${baseDateMatch.matched_column}`;
      manualEl.style.display = "none";
    } else if (baseDateMatch.status === "failed") {
      alertEl.style.display = "block";
      alertEl.className = "alert alert-warn";
      alertEl.textContent = "⚠️ 未自动识别到基准日期列";
      manualEl.style.display = "block";
    }

    log("info", `====== 清洗完成，未回销件数: ${rows.length} ======`);
    renderDashboard();
  } catch (err) {
    log("error", `管道执行失败: ${err.message}`);
    console.error(err);
  }
}

function buildBaseDateManualSelector() {
  const sel = document.getElementById("baseDateColSelect");
  sel.innerHTML = originalColumns.map(c => `<option value="${c}">${c}</option>`).join("");

  // Keep user's manual selection if valid; otherwise auto-detect
  if (!baseDateManualCol || !originalColumns.includes(baseDateManualCol)) {
    const aliases = CONFIG.due_days.base_date_aliases;
    const colsLower = originalColumns.map(c => String(c).trim().toLowerCase());
    for (const alias of aliases) {
      const key = alias.trim().toLowerCase();
      const idx = colsLower.indexOf(key);
      if (idx >= 0) { baseDateManualCol = originalColumns[idx]; break; }
    }
    if (!baseDateManualCol && originalColumns.length > 0) {
      baseDateManualCol = originalColumns[0];
    }
  }

  if (baseDateManualCol && originalColumns.includes(baseDateManualCol)) {
    sel.value = baseDateManualCol;
  }

  // Update manual col when user changes selection
  sel.onchange = () => {
    baseDateManualCol = sel.value;
    baseDateMatch = { status: "failed", matched_column: "" };
  };
}

// ============================================================
// RENDER DASHBOARD
// ============================================================
function renderDashboard() {
  document.getElementById("mainPlaceholder").style.display = "none";
  document.getElementById("dashboardContent").style.display = "block";
  document.getElementById("exportSection").style.display = "block";

  const filtered = getFilteredData();
  renderMetricCards(filtered);
  renderChart(filtered);
  renderTable(filtered);
  updateFilters();
  updateExportButtons();
}

// ============================================================
// FILTERING
// ============================================================
function getSelectedInstitution() {
  return document.getElementById("institutionSelect").value;
}

function getSelectedPeople() {
  const checks = document.querySelectorAll("#peopleMultiSelect input[type=checkbox]:checked");
  return Array.from(checks).map(cb => cb.value);
}

function getFilteredData() {
  if (!rawData) return [];
  let df = [...rawData];
  const inst = getSelectedInstitution();
  if (inst && inst !== "") {
    df = df.filter(r => String(r["主号机构"] || "").trim() === inst);
  }
  const people = getSelectedPeople();
  if (people.length > 0) {
    df = df.filter(r => people.includes(String(r["业务员"] || "").trim()));
  }
  return df;
}

let _lastPeopleList = null;

function updateFilters() {
  if (!rawData) return;

  // Institutions
  const insts = [...new Set(rawData.map(r => String(r["主号机构"] || "").trim()).filter(Boolean))].sort();
  const instSel = document.getElementById("institutionSelect");
  const prevInst = instSel.value;
  instSel.innerHTML = '<option value="">全部机构</option>' + insts.map(i => `<option value="${esc(i)}">${esc(i)}</option>`).join("");
  if (insts.includes(prevInst)) instSel.value = prevInst;

  // People (cascading)
  const instFilter = instSel.value;
  const src = instFilter ? rawData.filter(r => String(r["主号机构"] || "").trim() === instFilter) : rawData;
  const people = [...new Set(src.map(r => String(r["业务员"] || "").trim()).filter(Boolean))].sort();

  const container = document.getElementById("peopleMultiSelect");
  const prevPeople = getSelectedPeople();
  const validPrev = prevPeople.filter(p => people.includes(p));

  // 区分「首次渲染 / 机构级联变化 / 用户勾选」三种情况，避免清空后又被重置为全选
  const listChanged = !_lastPeopleList || _lastPeopleList.join("") !== people.join("");
  let defaultSelected;
  if (!_lastPeopleList) {
    defaultSelected = people;                      // 首次渲染：默认全选
  } else if (listChanged) {
    defaultSelected = validPrev.length > 0 ? validPrev : people; // 机构变化：保留有效项，否则全选
  } else {
    defaultSelected = validPrev;                   // 用户勾选/取消：原样保留（允许为空）
  }
  _lastPeopleList = people;

  container.innerHTML = people.map(p => {
    const checked = defaultSelected.includes(p) ? "checked" : "";
    return `<label data-name="${esc(p)}"><input type="checkbox" value="${esc(p)}" ${checked}> <span>${esc(p)}</span></label>`;
  }).join("");

  if (people.length === 0) {
    container.innerHTML = '<span class="count-line">无业务员数据</span>';
  }

  applyPeopleSearch();
}

function applyPeopleSearch() {
  const box = document.getElementById("peopleSearch");
  const term = (box ? box.value : "").trim().toLowerCase();
  const labels = document.querySelectorAll("#peopleMultiSelect label");
  labels.forEach(lbl => {
    const name = (lbl.textContent || "").trim().toLowerCase();
    lbl.style.display = (!term || name.includes(term)) ? "flex" : "none";
  });
  updatePeopleCount();
}

function updatePeopleCount() {
  const el = document.getElementById("peopleCount");
  if (!el) return;
  const total = document.querySelectorAll("#peopleMultiSelect label").length;
  const selected = getSelectedPeople().length;
  el.textContent = total > 0 ? `已选 ${selected} / ${total} 人` : "";
}

function selectAllPeople() {
  document.querySelectorAll("#peopleMultiSelect label").forEach(lbl => {
    if (lbl.style.display !== "none") {
      const cb = lbl.querySelector("input[type=checkbox]");
      if (cb) cb.checked = true;
    }
  });
  onFilterChange();
}

function clearAllPeople() {
  document.querySelectorAll("#peopleMultiSelect input[type=checkbox]").forEach(cb => cb.checked = false);
  onFilterChange();
}

let _filterUpdating = false;

function onFilterChange() {
  if (_filterUpdating) return;
  _filterUpdating = true;
  try {
    // Update people checkboxes when institution changes (cascading)
    updateFilters();
    const filtered = getFilteredData();
    renderMetricCards(filtered);
    renderChart(filtered);
    renderTable(filtered);
    updateExportButtons();
  } finally {
    _filterUpdating = false;
  }
}

// Attach listeners
document.getElementById("institutionSelect").addEventListener("change", onFilterChange);
document.getElementById("peopleMultiSelect").addEventListener("change", onFilterChange);
document.getElementById("peopleSearch").addEventListener("input", applyPeopleSearch);

// ============================================================
// METRIC CARDS
// ============================================================
function renderMetricCards(filtered) {
  const el = document.getElementById("metricsRow");
  const count = filtered.length;
  el.innerHTML = `
    <div class="metric-card">
      <div class="label">未回销总件数</div>
      <div class="value">${count.toLocaleString()}</div>
    </div>
  `;
}

// ============================================================
// PLOTLY CHART
// ============================================================
function renderChart(filtered) {
  if (filtered.length === 0) {
    document.getElementById("chart").innerHTML = '<div class="placeholder"><p>暂无数据</p></div>';
    return;
  }

  const hasDueDays = filtered.some(r => "到期天数" in r);
  if (!hasDueDays) {
    document.getElementById("chart").innerHTML = '<div class="placeholder"><p>暂无到期天数数据</p></div>';
    return;
  }

  const hasSalesperson = filtered.some(r => "业务员" in r);
  const bucketOrder = CONFIG.due_days.buckets.map(b => b.label);
  const colors = CONFIG.dashboard.chart.color_sequence;

  if (hasSalesperson) {
    // Group by bucket + salesperson
    const groups = {};
    for (const r of filtered) {
      const bucket = getBucketLabel(r["到期天数"] || 0);
      const person = String(r["业务员"] || "未知").trim();
      const key = `${bucket}|||${person}`;
      groups[key] = (groups[key] || 0) + 1;
    }

    const people = [...new Set(filtered.map(r => String(r["业务员"] || "未知").trim()))].sort();
    const traces = people.map((person, i) => {
      const x = bucketOrder;
      const y = bucketOrder.map(b => groups[`${b}|||${person}`] || 0);
      return {
        x, y,
        type: "bar",
        name: person,
        marker: { color: colors[i % colors.length] }
      };
    });

    Plotly.newPlot("chart", traces, {
      barmode: "group",
      title: CONFIG.dashboard.chart.title,
      xaxis: { title: CONFIG.dashboard.chart.x_label },
      yaxis: { title: CONFIG.dashboard.chart.y_label },
      legend: { title: { text: "业务员" } },
      margin: { t: 50, r: 20, b: 50, l: 60 }
    }, { responsive: true });
  } else {
    // Simple bar: count per bucket
    const counts = {};
    for (const r of filtered) {
      const bucket = getBucketLabel(r["到期天数"] || 0);
      counts[bucket] = (counts[bucket] || 0) + 1;
    }
    const x = bucketOrder;
    const y = bucketOrder.map(b => counts[b] || 0);

    Plotly.newPlot("chart", [{
      x, y,
      type: "bar",
      marker: { color: colors.slice(0, x.length) }
    }], {
      title: CONFIG.dashboard.chart.title,
      xaxis: { title: CONFIG.dashboard.chart.x_label },
      yaxis: { title: CONFIG.dashboard.chart.y_label },
      margin: { t: 50, r: 20, b: 50, l: 60 }
    }, { responsive: true });
  }
}

// ============================================================
// DETAIL TABLE
// ============================================================
let tableSortKey = null;
let tableSortAsc = true;

function renderTable(filtered) {
  document.getElementById("rowCount").textContent = `（${filtered.length} 条记录）`;

  if (filtered.length === 0) {
    document.getElementById("tableHead").innerHTML = "";
    document.getElementById("tableBody").innerHTML = '<tr><td colspan="10" style="text-align:center;color:#aaa;padding:30px;">暂无数据</td></tr>';
    return;
  }

  // Determine display columns (priority order)
  const priority = ["单号","主号机构","主号业务员","业务员","金额","基准日期","出单日期","到期天数"];
  const allCols = Object.keys(filtered[0]);
  const displayCols = priority.filter(c => allCols.includes(c));
  // Add any remaining columns
  for (const c of allCols) {
    if (!displayCols.includes(c)) displayCols.push(c);
  }

  // Sort
  let sorted = [...filtered];
  if (tableSortKey && displayCols.includes(tableSortKey)) {
    sorted.sort((a, b) => {
      const va = a[tableSortKey], vb = b[tableSortKey];
      if (typeof va === "number" && typeof vb === "number") {
        return tableSortAsc ? va - vb : vb - va;
      }
      const sa = String(va || ""), sb = String(vb || "");
      return tableSortAsc ? sa.localeCompare(sb, "zh") : sb.localeCompare(sa, "zh");
    });
  } else {
    // Default: sort by 到期天数 desc
    if (displayCols.includes("到期天数")) {
      sorted.sort((a, b) => (b["到期天数"] || 0) - (a["到期天数"] || 0));
    }
  }

  // Render header
  const headerHtml = displayCols.map(c => {
    let arrow = "";
    if (tableSortKey === c) arrow = tableSortAsc ? " ▲" : " ▼";
    return `<th onclick="sortTable('${c}')">${c}${arrow}</th>`;
  }).join("");
  document.getElementById("tableHead").innerHTML = `<tr>${headerHtml}</tr>`;

  // Render body
  const bodyHtml = sorted.map(r => {
    const cells = displayCols.map(c => {
      let v = r[c];
      if (c === "金额" && typeof v === "number") v = v.toFixed(2);
      if (c === "出单日期" && v instanceof Date) v = v.toISOString().split("T")[0];
      return `<td>${v !== undefined && v !== null ? String(v) : ""}</td>`;
    }).join("");
    return `<tr>${cells}</tr>`;
  }).join("");
  document.getElementById("tableBody").innerHTML = bodyHtml;
}

function sortTable(key) {
  if (tableSortKey === key) {
    tableSortAsc = !tableSortAsc;
  } else {
    tableSortKey = key;
    tableSortAsc = true;
  }
  renderTable(getFilteredData());
}

// ============================================================
// EXPORT
// ============================================================
function updateExportButtons() {
  const filtered = getFilteredData();
  const selected = getSelectedPeople();
  const allPeople = [...new Set(filtered.map(r => String(r["业务员"] || "").trim()).filter(Boolean))].sort();
  const toExport = selected.length > 0 ? selected : allPeople;

  const btnSelected = document.getElementById("btnExportSelected");
  if (toExport.length === 1) {
    btnSelected.textContent = `📦 导出 ${toExport[0]}`;
  } else if (toExport.length > 1) {
    btnSelected.textContent = `📦 一键导出 ${toExport.length} 人`;
  } else {
    btnSelected.textContent = "📦 无可导出业务员";
    btnSelected.disabled = true;
    return;
  }
  btnSelected.disabled = false;

  // Institution button
  const inst = getSelectedInstitution();
  const btnInst = document.getElementById("btnExportInstitution");
  if (inst && inst !== "") {
    const instPeople = [...new Set(
      rawData.filter(r => String(r["主号机构"] || "").trim() === inst)
        .map(r => String(r["业务员"] || "").trim()).filter(Boolean)
    )].sort();
    if (instPeople.length > 0) {
      btnInst.style.display = "block";
      btnInst.textContent = `🏢 导出「${inst}」全部 ${instPeople.length} 人`;
    } else {
      btnInst.style.display = "none";
    }
  } else {
    btnInst.style.display = "none";
  }
}

function getTimestamp() {
  const now = new Date();
  const pad = n => String(n).padStart(2, "0");
  return `${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`;
}

function exportSingleAsXlsx(rows, salesperson) {
  const ts = getTimestamp();
  const safeName = salesperson.replace(/[/\\]/g, "_").trim();
  const filename = `${ts}_未回销清单_${safeName}.xlsx`;

  // Build Excel-compatible 2D array
  if (rows.length === 0) return null;

  const priority = ["单号","主号机构","主号业务员","业务员","金额","基准日期","出单日期","到期天数"];
  const allCols = Object.keys(rows[0]);
  const displayCols = priority.filter(c => allCols.includes(c));
  for (const c of allCols) {
    if (!displayCols.includes(c)) displayCols.push(c);
  }

  // Sort by 到期天数 desc
  const sorted = [...rows].sort((a, b) => (b["到期天数"] || 0) - (a["到期天数"] || 0));

  const header = displayCols;
  const data = sorted.map(r => displayCols.map(c => {
    const v = r[c];
    if (c === "金额" && typeof v === "number") return v;
    return v !== undefined && v !== null ? v : "";
  }));

  const ws = XLSX.utils.aoa_to_sheet([header, ...data]);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, CONFIG.export.sheet_name);
  const wbout = XLSX.write(wb, { bookType: "xlsx", type: "array" });
  return { filename, data: wbout };
}

async function exportSelected() {
  const filtered = getFilteredData();
  const selected = getSelectedPeople();
  const allPeople = [...new Set(filtered.map(r => String(r["业务员"] || "").trim()).filter(Boolean))].sort();
  const toExport = selected.length > 0 ? selected : allPeople;

  if (toExport.length === 0) {
    alert("无可导出业务员");
    return;
  }

  const ts = getTimestamp();

  if (toExport.length === 1) {
    // Single export
    const person = toExport[0];
    const rows = rawData.filter(r => String(r["业务员"] || "").trim() === person);
    if (rows.length === 0) {
      alert(`业务员「${person}」无数据可导出`);
      return;
    }
    const result = exportSingleAsXlsx(rows, person);
    if (result) {
      downloadBlob(result.data, result.filename, "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");
      log("info", `导出完成: ${result.filename}`);
    }
  } else {
    // Batch export as zip
    const zip = new JSZip();
    let exported = 0;
    for (const person of toExport) {
      const rows = rawData.filter(r => String(r["业务员"] || "").trim() === person);
      if (rows.length === 0) continue;
      const result = exportSingleAsXlsx(rows, person);
      if (result) {
        zip.file(result.filename, result.data);
        exported++;
      }
    }
    if (exported === 0) {
      alert("所选业务员均无数据");
      return;
    }
    const zipData = await zip.generateAsync({ type: "blob" });
    downloadBlob(zipData, `${ts}_未回销清单_批量.zip`, "application/zip");
    log("info", `批量导出完成，共 ${exported} 个文件`);
  }
}

async function exportInstitution() {
  const inst = getSelectedInstitution();
  if (!inst || inst === "") return;

  const instPeople = [...new Set(
    rawData.filter(r => String(r["主号机构"] || "").trim() === inst)
      .map(r => String(r["业务员"] || "").trim()).filter(Boolean)
  )].sort();

  if (instPeople.length === 0) {
    alert(`机构「${inst}」无业务员数据`);
    return;
  }

  const ts = getTimestamp();
  const zip = new JSZip();
  let exported = 0;

  for (const person of instPeople) {
    const rows = rawData.filter(r => String(r["业务员"] || "").trim() === person);
    if (rows.length === 0) continue;
    const result = exportSingleAsXlsx(rows, person);
    if (result) {
      zip.file(result.filename, result.data);
      exported++;
    }
  }

  if (exported === 0) {
    alert("无数据可导出");
    return;
  }

  const zipData = await zip.generateAsync({ type: "blob" });
  downloadBlob(zipData, `${ts}_${inst}_未回销清单.zip`, "application/zip");
  log("info", `机构「${inst}」导出完成，共 ${exported} 个文件`);
}

function downloadBlob(data, filename, mimeType) {
  const blob = new Blob([data], { type: mimeType });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
